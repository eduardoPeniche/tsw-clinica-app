services:
  api:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - clinica_data:/data
    environment:
      DATABASE_PATH: /data/clinica.db
      CLINIC_TIME_ZONE: America/Merida
      APPOINTMENT_WEEKDAYS: "0,1,2,3,4"
      APPOINTMENT_OPENING_TIME: "09:00"
      APPOINTMENT_CLOSING_TIME: "17:00"
      APPOINTMENT_DURATION_MINUTES: "30"

  frontend:
    build:
      context: ./frontend
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8000
      OPENAPI_URL: http://api:8000/openapi.json

volumes:
  clinica_data:
